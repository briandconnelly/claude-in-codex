name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release-lockstep:
    name: Release lockstep
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate release metadata consistency
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          tag="v${version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pyproject.toml version must be X.Y.Z; got ${version}" >&2
            exit 1
          fi

          grep -Fq "\"version\": \"${version}\"" .codex-plugin/plugin.json
          grep -Fq "@${tag}" .mcp.json
          grep -Fq "claude-in-codex==${version}" README.md
          grep -Fq "## ${version} -" CHANGELOG.md

  claude-contract:
    name: Claude CLI contract drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # This job installs a freshly fetched npm package whose install scripts
          # run in this workspace. Don't leave the checkout token in git config for
          # it to read; the job never pushes and only needs `contents: read`.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --python 3.12 --group dev

      # Install the latest published Claude Code so this job is a live drift canary
      # against the newest CLI. Failure (offline runner, npm hiccup) is non-fatal:
      # the next step skips gracefully if `claude` is unavailable.
      - name: Install Claude Code CLI
        id: install-claude
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Check CLI contract drift (no-spend)
        run: |
          set -euo pipefail
          if ! command -v claude >/dev/null 2>&1; then
            echo "::notice::claude CLI unavailable on this runner; skipping contract drift check."
            exit 0
          fi
          claude --version
          # Exits 1 on real drift (fails the job); 2 if it could not probe at all.
          uv run python scripts/check_claude_contract.py

  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --python 3.12 --group dev

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Smoke test installed wheel
        run: |
          set -euo pipefail

          python -m venv .smoke
          .smoke/bin/python -m pip install --upgrade pip
          .smoke/bin/python -m pip install dist/claude_in_codex-*.whl
          .smoke/bin/python - <<'PY'
          from importlib.metadata import distribution

          import claude_in_codex

          dist = distribution("claude-in-codex")
          scripts = [
              ep
              for ep in dist.entry_points
              if ep.group == "console_scripts" and ep.name == "claude-in-codex-mcp"
          ]

          assert claude_in_codex.__version__ == dist.version
          assert scripts, "claude-in-codex-mcp console script is missing"
          scripts[0].load()
          PY

  live-integration:
    name: Live Claude integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Same environment as the release gate. Same secret, same paid spend, same
    # third-party install: the credential's protection rules should not depend on
    # which of the two jobs reaches it.
    environment: live-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # This job installs a freshly fetched npm package whose install scripts
          # run in this workspace. Don't leave the checkout token in git config for
          # it to read; the job never pushes and only needs `contents: read`.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Same fail-closed flag as the release gate: a manual run that skipped
      # every test used to report success, which is the state #170 is about.
      # ANTHROPIC_API_KEY alone is NOT enough for this suite. Its contract tests
      # run under config_mode=inherit and config_mode=safe, and those modes strip
      # ANTHROPIC_API_KEY on purpose (_LOGIN_MODES in claude.py) and require a
      # Claude Code login session. The environment must therefore supply a
      # login-backed credential; the key is passed through only for any
      # bare-mode path. The prerequisite probes config_mode=inherit, so a
      # key-only runner fails immediately and says why, rather than passing and
      # letting three envelope tests fail on authentication.
      - name: Run integration tests
        env:
          # The credential the contract tests actually need. They run under
          # config_mode=inherit and config_mode=safe, which strip
          # ANTHROPIC_API_KEY (_LOGIN_CREDENTIAL_ENV_VARS in claude.py) and
          # require a Claude Code login session. Generate with `claude
          # setup-token`. Without it this job fails at the prerequisite -- which
          # is correct, but it fails EVERY time, so the gate would block every
          # release rather than gate it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Kept for any bare-mode path; not sufficient on its own.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_IN_CODEX_REQUIRE_LIVE: "1"
        run: uv run pytest -m integration --no-cov

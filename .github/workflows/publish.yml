name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, with or without leading v
        required: true
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Validate version references
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must run from main; got $GITHUB_REF" >&2
              exit 1
            fi
            version="${INPUT_VERSION#v}"
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists" >&2
              exit 1
            fi
          else
            tag="$REF_NAME"
            version="${tag#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z; got ${version}" >&2
            exit 1
          fi

          grep -Fq "version = \"${version}\"" pyproject.toml
          grep -Fq "\"version\": \"${version}\"" .codex-plugin/plugin.json
          grep -Fq "@${tag}" .mcp.json
          grep -Fq "claude-in-codex==${version}" README.md
          grep -Fq "## ${version} -" CHANGELOG.md

          {
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: release-metadata
    uses: ./.github/workflows/test.yml

  # The gate for the half of the `claude` CLI contract that no-spend tests cannot
  # cover (ENVELOPE_KEYS, SUCCESS_SUBTYPES, USAGE_KEYS). AGENTS.md and
  # COMPATIBILITY.md have named it the pre-release gate all along, but nothing ran
  # it: dispatch-only in ci.yml, absent here, deselected locally. So a release
  # could be cut with the gate never having run, and nothing recorded that (#170).
  #
  # It runs BEFORE build/publish and they depend on it, so a failure stops the
  # release rather than being noticed afterwards.
  #
  # CLAUDE_IN_CODEX_REQUIRE_LIVE=1 is what makes this a gate rather than another
  # skippable job: the suite skips itself when `claude` is absent, so without it
  # a runner with no CLI and no key would exit 0 and report the contract verified.
  # Under the flag a missing prerequisite fails, and the session additionally
  # refuses to pass unless a floor of integration tests actually ran.
  #
  # `environment:` keeps the paid credential behind its own protection rules
  # rather than making it ambiently available to the release workflow.
  live-integration:
    name: Live Claude integration (release gate)
    needs: test
    runs-on: ubuntu-latest
    environment: live-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # This job installs a freshly fetched npm package whose install scripts
          # run in this workspace. Don't leave the checkout token in git config for
          # it to read; the job never pushes and only needs `contents: read`.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # ANTHROPIC_API_KEY alone is NOT enough for this suite. Its contract tests
      # run under config_mode=inherit and config_mode=safe, and those modes strip
      # ANTHROPIC_API_KEY on purpose (_LOGIN_MODES in claude.py) and require a
      # Claude Code login session. The environment must therefore supply a
      # login-backed credential; the key is passed through only for any
      # bare-mode path. The prerequisite probes config_mode=inherit, so a
      # key-only runner fails immediately and says why, rather than passing and
      # letting three envelope tests fail on authentication.
      - name: Run the live contract gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_IN_CODEX_REQUIRE_LIVE: "1"
        run: uv run pytest -m integration --no-cov

  build:
    name: Build distributions
    needs: [test, live-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        # Must be the COMMIT sha, not the sha of an annotated tag object: this
        # is a Docker action whose image is published to ghcr.io under the
        # commit sha, so a tag-object sha checks out fine and then dies with
        # `manifest unknown` when Docker pulls the image. Also keep it at a
        # revision bundling twine >= 7.0.0 / packaging >= 26.2 — earlier
        # versions reject the Metadata-Version 2.5 that hatchling now emits.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    needs: [release-metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create tag if needed
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "claude-in-codex ${TAG}" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
            exit 0
          fi

          gh release create "$TAG" dist/* \
            --title "claude-in-codex ${TAG}" \
            --notes "See CHANGELOG.md for release notes."

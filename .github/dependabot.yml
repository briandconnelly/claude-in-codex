version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init and codeql-action/analyze must run the same
      # version: analyze fails with "Loaded a configuration file for version
      # X, but running version Y" when only one of them moves. Split into
      # separate PRs, neither can pass CI, so keep them in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
